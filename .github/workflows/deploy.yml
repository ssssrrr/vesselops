# CD — CI 를 통과한 커밋만 서버에 반영한다.
#
# 서버에서 하는 일은 수동 갱신 배포(docs/09-deployment.md 3.4)와 같다.
# 저장소 설정이 필요하다 (docs/09-deployment.md 7.3):
#   Variables  DEPLOY_ENABLED=true        ← 이 값이 없으면 배포를 건너뛴다
#   Secrets    DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

# 배포는 겹치지 않게 하나씩. 진행 중인 배포를 중간에 끊지 않는다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 서버 반영
    # PR 의 CI 결과로는 배포하지 않는다. push 로 돈 CI 가 성공했을 때만.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      # CI 가 검증한 바로 그 커밋. 수동 실행이면 선택한 브랜치의 커밋
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # 서버 지문을 미리 등록해 두고 대조한다 (StrictHostKeyChecking 을 끄지 않는다)
      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: 갱신 배포
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_SHA" <<'EOF'
          set -euo pipefail
          cd ~/vesselops
          git fetch origin
          # 서버에서 고친 것이 있으면 여기서 멈춘다. 덮어쓰지 않는다
          git merge --ff-only "$1"
          docker compose up -d --build
          docker compose ps
          EOF

      # api 가 다시 뜰 때까지 기다렸다가 밖에서 조회해 본다
      - name: 배포 확인
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors \
            "http://$DEPLOY_HOST/api/v1/vessels" | jq -e 'length == 4'
