# VesselOps MQTT 접근 제어
#
# 사용자명은 클라이언트 인증서의 CN 이다 (mosquitto.conf 의 use_identity_as_username).
# 여기에 없는 토픽은 전부 거부된다.

# 육상 수집기 — 읽기만 한다
user ingest-1
topic read vesselops/telemetry/#
topic read vesselops/status/#

# 브로커 상태 점검
user healthcheck
topic read $SYS/broker/version

# 선박 — 인증서의 CN 이 IMO 번호다. 자기 번호의 토픽에만 발행할 수 있고, 읽기 권한은 없다.
# A 선박의 인증서로 B 선박의 토픽에 발행하면 브로커가 버린다.
pattern write vesselops/telemetry/%u/#
pattern write vesselops/status/%u
