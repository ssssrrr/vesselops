# VesselOps MQTT 브로커 설정
#
# 평문 리스너는 두지 않는다 (NFR-05). 접속은 TLS(8883) + 클라이언트 인증서로만 받는다.
# 인증서는 pki 컨테이너가 최초 기동 때 발급한다 (deploy/pki/gen-certs.sh).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT over TLS — TLS 1.2 이상 (기본값)
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# 우리 CA 가 발급한 인증서가 없으면 접속 자체를 받지 않는다
require_certificate true
# 인증서의 CN 을 사용자명으로 쓴다 — 선박은 IMO 번호가 곧 사용자명이다
use_identity_as_username true
allow_anonymous false

# 토픽별 권한 — 선박은 자기 IMO 의 토픽에만 발행할 수 있다
# 원본은 deploy/mosquitto/acl.conf. pki 컨테이너가 브로커 계정 소유로 복사해 둔다
acl_file /mosquitto/certs/acl.conf

# 선박 통신 단절 대비: 세션과 큐 보존 (FR-106 재전송)
max_queued_messages 10000
persistent_client_expiration 7d
