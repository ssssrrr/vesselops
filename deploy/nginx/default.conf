# VesselOps 웹 진입점
#
# 브라우저는 이 한 곳만 본다. 뒤쪽 서비스의 주소·포트는 밖으로 드러나지 않는다.
#   /api/  → 업무 API (Spring Boot)
#   /ws    → 육상 수집기 WebSocket
#   /sim/  → 시연 제어 (시뮬레이터 / Edge 수집기)

# 컨테이너가 재생성돼 IP 가 바뀌어도 다시 찾도록 Docker 내장 DNS 로 매번 해석한다
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        set $ingest http://ingest:3001;
        proxy_pass $ingest;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # 위성 링크 단절/복구는 Edge 수집기가 처리한다
    location = /sim/link {
        set $edge http://edge-gw:3002;
        rewrite ^ /link break;
        proxy_pass $edge;
    }

    location /sim/ {
        set $sim http://sim-fleet:3000;
        proxy_pass $sim;
    }
}
